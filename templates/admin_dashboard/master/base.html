{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            NAFI Admin Dashboard
        {% endblock  %}
    </title>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Base CSS -->
    <link rel="stylesheet"
          href="{% static 'css/base.css' %}">

    <!-- Sidebar CSS -->
    <link rel="stylesheet"
          href="{% static 'css/sidebar.css' %}">

    <!-- Navbar CSS -->
    <link rel="stylesheet"
          href="{% static 'css/navbar.css' %}">

    <!-- Dashboard CSS -->
    {% block css %}

    {% endblock %}

</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->

    <aside class="sidebar">

        {% include 'admin_dashboard/master/sidebar.html' %}

    </aside>

    <!-- Main -->

    <main class="main-content">

        <!-- Navbar -->

        {% include 'admin_dashboard/master/navbar.html' %}

        <!-- Page Content -->

        <section class="page-content">

            {% block content %}

            {% endblock %}

        </section>

    </main>

</div>

<!-- Dashboard JS -->

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="{% static 'js/dashboard.js' %}"></script>
<script src="{% static 'js/chart.js' %}"></script>
<script src="{% static 'js/theme.js' %}"></script>

{% block js %}

{% endblock %}

</body>

</html>
