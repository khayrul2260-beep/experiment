{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %} NAFI Admin Dashboard {% endblock %}</title>

    <link rel="icon" type="image/png" href="{% static 'admin_panel/images/logo.png' %}" />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    />
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Base CSS -->
    <link rel="stylesheet" href="{% static 'admin_panel/css/base.css' %}" />

    <!-- Sidebar CSS -->
    <link rel="stylesheet" href="{% static 'admin_panel/css/sidebar.css' %}" />

    <!-- Navbar CSS -->
    <link rel="stylesheet" href="{% static 'admin_panel/css/navbar.css' %}" />

    <!-- Dashboard CSS -->
    {% block css %} {% endblock %}
  </head>

  <body>


    <div class="wrapper">
      <!-- Sidebar -->
      <div class="sidebar-header">
        <a href="#" class="logo">
          <img
            src="{% static 'admin_panel/images/logo.png' %}"
            alt="brand-logo"
            class="brand_logo"
          />

          <img
            src="{% static 'admin_panel/images/nafi_title.png' %}"
            alt="brand-title"
            class="brand_title"
          />
        </a>
      </div>

      <!-- Desktop Sidebar -->
      <aside class="sidebar d-none d-lg-block">
        {% include 'admin_dashboard/master/sidebar.html' %}
      </aside>
      <!-- Main -->

      <main class="main-content">
        <!-- Navbar -->

        {% include 'admin_dashboard/master/navbar.html' %}

        <!-- Page Content -->

        <section class="page-content">
          {% block content %} {% endblock %}
        </section>
      </main>
    </div>

    <!-- Dashboard JS -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    {% block js %} {% endblock %}
  </body>
</html>
