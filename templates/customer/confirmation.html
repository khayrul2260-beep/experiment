<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NAFI | Order Confirmed</title>
  <style>
    :root {
      --nafi-bg: #050505;
      --nafi-panel: rgba(255,255,255,0.02);
      --nafi-white: #f5f5f5;
      --nafi-soft: #bdbdbd;
      --nafi-blue: #4d8dff;
      --nafi-blue-deep: #08111f;
      --nafi-line: rgba(255,255,255,0.10);
      --nafi-glow: rgba(77,141,255,0.18);
      --nafi-glow-soft: rgba(77,141,255,0.08);
      --nafi-shadow: rgba(0,0,0,0.55);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--nafi-bg);
      color: var(--nafi-white);
      font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 18%, rgba(77,141,255,0.06), transparent 30%),
        radial-gradient(circle at 50% 88%, rgba(77,141,255,0.03), transparent 30%),
        var(--nafi-bg);
      padding: 32px 18px;
    }

    .nafi-order-page {
      width: min(100%, 620px);
      background: rgba(255,255,255,0.01);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 24px 80px rgba(0,0,0,0.38);
      padding: 38px 28px 30px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .nafi-order-page::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(255,255,255,0.015),
        rgba(255,255,255,0.005) 30%,
        rgba(255,255,255,0)
      );
      pointer-events: none;
    }

    .eyebrow {
      position: relative;
      z-index: 1;
      margin: 0 0 18px;
      color: var(--nafi-soft);
      font-size: 11px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      font-weight: 500;
    }

    .order-icon-wrap {
      position: relative;
      z-index: 1;
      width: 220px;
      height: 220px;
      margin: 0 auto 12px;
      display: grid;
      place-items: center;
    }

    .nafi-order-icon {
      width: 100%;
      height: 100%;
      display: block;
      position: relative;
      filter: drop-shadow(0 18px 28px rgba(0,0,0,0.18));
    }

    .nafi-order-icon svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .shell-base {
      fill: none;
      stroke: rgba(245,245,245,0.16);
      stroke-width: 1.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .shell-fill {
      fill: none;
      stroke: #4d8dff;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 402;
      stroke-dashoffset: 402;
      opacity: 0;
      animation: border-fill 1.8s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
    }

    .shell-soft {
      fill: none;
      stroke: rgba(77,141,255,0.22);
      stroke-width: 1.2;
      opacity: 0;
      transform-origin: 50% 50%;
      animation: ring-soft 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
    }

    .shell-glow {
      fill: none;
      stroke: rgba(77,141,255,0.35);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      transform-origin: 50% 50%;
      animation: ring-glow 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards;
    }

    .check {
      fill: none;
      stroke: #4d8dff;
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      opacity: 0;
      animation: check-draw 1s cubic-bezier(0.2, 0.75, 0.25, 1) 0.7s forwards;
    }

    .check-glow {
      fill: none;
      stroke: rgba(77,141,255,0.8);
      stroke-width: 1.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      filter: blur(2.5px);
      animation: check-glow-effect 1.1s ease-out 0.85s forwards;
    }

    .pulse {
      fill: none;
      stroke: rgba(77,141,255,0.28);
      stroke-width: 1.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      transform-origin: 50% 50%;
      animation: premium-pulse 1.4s cubic-bezier(0.16, 1, 0.3, 1) 1.1s forwards;
    }

    .pulse-outer {
      fill: none;
      stroke: rgba(77,141,255,0.16);
      stroke-width: 1;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      transform-origin: 50% 50%;
      animation: premium-pulse-outer 1.7s cubic-bezier(0.16, 1, 0.3, 1) 1.15s forwards;
    }

    .spark {
      fill: rgba(77,141,255,0.85);
      opacity: 0;
      transform-origin: 50% 50%;
      animation: particle 1.35s ease-out 1s forwards;
    }

    .spark.light {
      fill: rgba(255,255,255,0.8);
    }

    .ambient {
      opacity: 0.9;
      animation: ambient-fade 1.6s ease-out 0.15s forwards;
    }

    .ambient .inner {
      fill: rgba(77,141,255,0.09);
      filter: blur(20px);
    }

    .ambient .outer {
      fill: rgba(77,141,255,0.04);
      filter: blur(24px);
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 2px 0 0;
      font-size: clamp(2.3rem, 4vw, 3.2rem);
      letter-spacing: -0.065em;
      line-height: 0.98;
      font-weight: 500;
    }

    .subhead {
      position: relative;
      z-index: 1;
      margin: 18px auto 26px;
      max-width: 420px;
      color: rgba(245,245,245,0.84);
      font-size: 15px;
      letter-spacing: 0.05em;
      line-height: 1.7;
    }

    .meta {
      position: relative;
      z-index: 1;
      width: min(100%, 350px);
      margin: 0 auto 24px;
      padding-top: 18px;
      border-top: 1px solid var(--nafi-line);
    }

    .meta-label {
      margin: 0 0 6px;
      color: var(--nafi-soft);
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    .meta-value {
      margin: 0;
      font-size: 15px;
      letter-spacing: 0.08em;
      color: var(--nafi-white);
      font-weight: 500;
    }

    .summary {
      position: relative;
      z-index: 1;
      width: min(100%, 420px);
      margin: 0 auto 28px;
      border-top: 1px solid var(--nafi-line);
      border-bottom: 1px solid var(--nafi-line);
    }

    .summary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      color: rgba(245,245,245,0.78);
      font-size: 14px;
    }

    .summary-row:last-child {
      border-bottom: none;
    }

    .summary-row.total {
      color: var(--nafi-white);
      font-weight: 500;
    }

    .cta {
      position: relative;
      z-index: 1;
      appearance: none;
      background: transparent;
      border: 1px solid rgba(77,141,255,0.35);
      color: #4d8dff;
      padding: 16px 28px;
      min-width: 198px;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 180ms ease, background 180ms ease, transform 180ms ease, color 180ms ease;
    }

    .cta:hover {
      border-color: rgba(77,141,255,0.6);
      background: rgba(77,141,255,0.06);
      color: var(--nafi-white);
    }

    .cta:active {
      transform: translateY(1px);
    }

    @keyframes border-fill {
      0% {
        stroke-dashoffset: 402;
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }

    @keyframes ring-glow {
      0% {
        opacity: 0;
        stroke-dasharray: 0 1000;
        transform: scale(0.94);
      }
      28% {
        opacity: 0.7;
      }
      100% {
        opacity: 0.18;
        stroke-dasharray: 200 1000;
        transform: scale(1.03);
      }
    }

    @keyframes ring-soft {
      0% {
        opacity: 0;
        transform: scale(0.88);
      }
      25% {
        opacity: 0.6;
        transform: scale(0.95);
      }
      100% {
        opacity: 0.22;
        transform: scale(1);
      }
    }

    @keyframes check-draw {
      0% {
        opacity: 0;
        stroke-dashoffset: 1000;
      }
      20% {
        opacity: 1;
      }
      100% {
        opacity: 1;
        stroke-dashoffset: 0;
      }
    }

    @keyframes check-glow-effect {
      0% {
        opacity: 0;
        transform: scaleX(0.35);
      }
      32% {
        opacity: 0.7;
      }
      100% {
        opacity: 0.2;
        transform: scaleX(1);
      }
    }

    @keyframes premium-pulse {
      0% {
        opacity: 0;
        transform: scale(0.8);
        stroke-dasharray: 0 180;
      }
      20% {
        opacity: 0.8;
      }
      100% {
        opacity: 0;
        transform: scale(1.35);
        stroke-dasharray: 35 200;
      }
    }

    @keyframes premium-pulse-outer {
      0% {
        opacity: 0;
        transform: scale(0.9);
      }
      22% {
        opacity: 0.5;
      }
      100% {
        opacity: 0;
        transform: scale(1.42);
      }
    }

    @keyframes particle {
      0% {
        opacity: 0;
        transform: translateY(0) translateX(0) scale(0.6);
      }
      20% {
        opacity: 0.85;
      }
      100% {
        opacity: 0;
        transform: translateY(-12px) translateX(var(--tx, 0)) scale(0.95);
      }
    }

    @keyframes ambient-fade {
      0% { opacity: 0.15; }
      100% { opacity: 0.95; }
    }

    @media (max-width: 767px) {
      .nafi-order-page {
        padding: 28px 18px 22px;
      }

      .order-icon-wrap {
        width: 170px;
        height: 170px;
      }

      .subhead {
        font-size: 14px;
        letter-spacing: 0.04em;
      }

      .summary-row {
        font-size: 13px;
      }

      .cta {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .shell-fill,
      .shell-soft,
      .shell-glow,
      .check,
      .check-glow,
      .pulse,
      .pulse-outer,
      .spark,
      .ambient {
        animation: none !important;
      }

      .shell-fill,
      .check,
      .shell-soft {
        opacity: 1;
        stroke-dashoffset: 0;
      }

      .shell-glow,
      .check-glow,
      .pulse,
      .pulse-outer {
        opacity: 0.22;
      }
    }
  </style>
</head>
<body>
  <main class="nafi-order-page" aria-labelledby="nafi-order-title">
    <p class="eyebrow">Order Confirmed</p>

    <div class="order-icon-wrap">
      <div class="nafi-order-icon" aria-label="Order confirmed" role="img">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <radialGradient id="nafiGlowBlue" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="rgba(77,141,255,0.18)" />
              <stop offset="55%" stop-color="rgba(77,141,255,0.06)" />
              <stop offset="100%" stop-color="rgba(77,141,255,0)" />
            </radialGradient>
          </defs>

          <g class="ambient">
            <circle class="outer" cx="100" cy="100" r="64" fill="rgba(77,141,255,0.03)" />
            <circle class="inner" cx="100" cy="100" r="52" fill="url(#nafiGlowBlue)" />
          </g>

          <circle class="shell-base" cx="100" cy="100" r="64" />
          <circle class="shell-soft" cx="100" cy="100" r="60" />
          <circle class="shell-glow" cx="100" cy="100" r="60" />
          <circle class="shell-fill" cx="100" cy="100" r="64" />

          <path class="check" d="M68 102.5 L90 124 L133 76" />
          <path class="check-glow" d="M68 102.5 L90 124 L133 76" />

          <circle class="pulse" cx="100" cy="100" r="44" />
          <circle class="pulse-outer" cx="100" cy="100" r="50" />

          <circle class="spark" cx="82" cy="71" r="1.6" />
          <circle class="spark light" cx="120" cy="72" r="1.3" />
          <circle class="spark" cx="132" cy="103" r="1.4" />
          <circle class="spark light" cx="92" cy="131" r="1.2" />
        </svg>
      </div>
    </div>

    <h1 id="nafi-order-title">Order Confirmed</h1>

    <p class="subhead">
      Thank you for shopping with NAFI. Your order has been placed and is now being prepared.
    </p>

    <div class="meta">
      <p class="meta-label">Order number</p>
      <p class="meta-value">#NAFI-2048</p>
    </div>

    <div class="summary">
      <div class="summary-row">
        <span>Delivery</span>
        <span>Standard</span>
      </div>
      <div class="summary-row">
        <span>Estimated arrival</span>
        <span>3–5 business days</span>
      </div>
      <div class="summary-row total">
        <span>Total</span>
        <span>$420.00</span>
      </div>
    </div>

    <button class="cta" type="button">Continue Shopping</button>
  </main>
</body>
</html>
