<!-- Hero Section -->
{% load static %}
<section class="nafi-hero" id="home">

    <div class="nafi-hero-container">

        <!-- Hero Content -->
        <div class="nafi-hero-content">

            <span class="nafi-hero-subtitle">
                PREMIUM MEN'S FASHION
            </span>

            <h1 class="nafi-hero-title">
                STYLE THAT
                <span>DEFINES YOU.</span>
            </h1>

            <p class="nafi-hero-description">
                Discover premium men's fashion designed for confidence,
                comfort, and timeless style.
            </p>

            <div class="nafi-hero-buttons">

                <a href="#" class="nafi-hero-btn nafi-hero-btn-primary">
                    SHOP COLLECTION
                    <span>→</span>
                </a>

                <a href="#" class="nafi-hero-btn nafi-hero-btn-secondary">
                    EXPLORE PRODUCTS
                </a>

            </div>

        </div>


        <!-- Hero Visual -->
        <div class="nafi-hero-visual">

            <div class="nafi-hero-image-wrapper">

                <img
                    src="{% static 'customer/images/model.jpeg' %}" 
                    alt="NAFI Men's Fashion"
                    class="nafi-hero-image"
                > 
            </div>

            <!-- Decorative Elements -->
            <div class="nafi-hero-decoration nafi-hero-decoration-one"></div>
            <div class="nafi-hero-decoration nafi-hero-decoration-two"></div>

            <!-- Floating Badge -->
            <div class="nafi-hero-badge">

                <span class="nafi-hero-badge-number">
                    01
                </span>

                <span class="nafi-hero-badge-text">
                    NEW<br>
                    COLLECTION
                </span>

            </div>

        </div>

    </div>

    <!-- Scroll Indicator -->
    <div class="nafi-hero-scroll">

        <span class="nafi-hero-scroll-line"></span>

        <span class="nafi-hero-scroll-text">
            SCROLL TO EXPLORE
        </span>

    </div>

</section>
