{% load static %}
<section class="home main_section">
    <div class="slide_show">
      <div
        id="carouselExampleFade"
        class="carousel slide carousel-fade"
        data-bs-ride="carousel"
        data-bs-interval="3000"
      >
        <div class="carousel-inner" style="z-index: 0">
          <div class="carousel-item active">
            <img
              src="{% static 'customer/images/shoppic1.png' %}"
              class="d-block w-100 auto_slide"
              alt="..."
            />
            <!-- 1402px*1122px -->
          </div>
          <div class="carousel-item">
            <img
              src="{% static 'customer/images/shoppic2.png' %}"
              class="d-block w-100 auto_slide"
              alt="..."
            />
          </div>
          <div class="carousel-item">
            <img
              src="{% static 'customer/images/shoppic11.png' %}"
              class="d-block w-100 auto_slide"
              alt=""
            />
          </div>
          <div class="carousel-item">
            <img
              src="{% static 'customer/images/shoppic22.png' %}"
              class="d-block w-100 auto_slide"
              alt="..."
            />
          </div>
        </div>
        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#carouselExampleFade"
          data-bs-slide="prev"
        >
          <span
            class="carousel-control-prev-icon"
            aria-hidden="true"
          ></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#carouselExampleFade"
          data-bs-slide="next"
        >
          <span
            class="carousel-control-next-icon"
            aria-hidden="true"
          ></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </div>
</section>
