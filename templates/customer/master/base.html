{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}NAFI{% endblock %}</title>

    <link rel="icon" type="image/png" href="{% static 'admin_panel/images/logo.png' %}" />

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- NAFI Navbar CSS -->
    <link rel="stylesheet" href="{% static 'customer/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'customer/css/navbar.css' %}">
    <link rel="stylesheet" href="{% static 'customer/css/footer.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    {% block extra_css %}
    {% endblock %}

</head>

<body>



{% include 'customer/master/nav.html' %}

<!-- =====================================================
     MAIN CONTENT
===================================================== -->

<main class="main">

    {% block content %}

    {% endblock %}

</main>



{% include 'customer/master/footer.html' %}

 

<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


<script>

    /*
    ======================================================
    NAVBAR SCROLL EFFECT
    ======================================================
    */

    window.addEventListener("scroll", function () {

        const navbar = document.getElementById("nafiNavbar");

        if (window.scrollY > 50) {

            navbar.classList.add("navbar-scrolled");

        } else {

            navbar.classList.remove("navbar-scrolled");

        }

    });

</script>
<script src="{% static 'customer/js/navbar.js' %}"></script>

{% block extra_js %}{% endblock %}

</body>
</html>
